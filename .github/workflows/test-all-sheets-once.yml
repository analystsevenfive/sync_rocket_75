name: Test all sheets once at 09-30 Bangkok

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 9 9 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: test-all-sheets-once-2026-09-09-0930
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch the nine production syncs once on the test date
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import datetime, json, os, time, urllib.request

          target = datetime.datetime(2026, 9, 9, 2, 30, tzinfo=datetime.timezone.utc)
          now = datetime.datetime.now(datetime.timezone.utc)
          if now.date() != target.date():
              print('Temporary test has expired; nothing dispatched.')
              raise SystemExit(0)
          if (target - now).total_seconds() > 1200:
              raise RuntimeError('This one-time test may only be armed within 20 minutes of 09:30 Bangkok.')
          while datetime.datetime.now(datetime.timezone.utc) < target:
              time.sleep(5)

          api = 'https://api.github.com/repos/' + os.environ['REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          # A scheduled event can queue behind the manually armed run at 09:30.
          # Do not dispatch again if a test run already completed today for 09:30.
          request = urllib.request.Request(
              api + '/actions/workflows/test-all-sheets-once.yml/runs?per_page=30', headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              previous = json.load(response)['workflow_runs']
          if any(str(run['id']) != os.environ['RUN_ID'] and
                 run['status'] == 'completed' and
                 run['created_at'] >= '2026-09-09T02:20:00Z' for run in previous):
              print('A test run already completed today for 09:30; nothing dispatched.')
              raise SystemExit(0)
          workflows = [
              'sync-yesterday-jobs.yml', 'sync-daily-repair.yml',
              'sync-tomorrow-plan.yml', 'sync-ticket-stage.yml',
              'sync-gasoline.yml', 'sync-7day-installation-plan.yml',
              'sync-employee.yml', 'sync-tickets.yml',
              'sync-trick2.yml'
          ]
          failures = []
          for i, workflow in enumerate(workflows):
              if i > 0:
                  time.sleep(15)
              request = urllib.request.Request(api + '/actions/workflows/' + workflow + '/dispatches',
                  data=json.dumps({'ref': 'main'}).encode(), headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(workflow + ': accepted, HTTP ' + str(response.status), flush=True)
              except Exception as error:
                  failures.append(workflow)
                  print(workflow + ': ' + str(error), flush=True)
          # Disable this temporary dispatcher even on partial failure, so the cron
          # event or an accidental future dispatch cannot repeat today's test.
          request = urllib.request.Request(api + '/actions/workflows/test-all-sheets-once.yml/disable',
              headers=headers, method='PUT')
          with urllib.request.urlopen(request, timeout=30):
              print('Temporary dispatcher disabled.', flush=True)
          if failures:
              raise RuntimeError('Dispatch failed for: ' + ', '.join(failures))
