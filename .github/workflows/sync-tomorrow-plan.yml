name: Sync Tomorrow Technician Plan

on:
  workflow_dispatch:
  schedule:
    # 19:05 เวลาไทย (UTC+7) = 12:05 UTC — วันละครั้ง (เลี่ยงนาทีที่ :00 เพื่อไม่ให้ติดคิว Delay ของ GitHub Actions)
    - cron: '5 12 * * *'

concurrency:
  group: sync-tomorrow-plan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tomorrow plan sync
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node sync-tomorrow-plan.js
