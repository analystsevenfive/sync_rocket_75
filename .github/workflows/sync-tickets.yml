name: Sync Tickets

on:
  workflow_dispatch:
  # schedule:
  #   # 05:30 เวลาไทย (UTC+7) = 22:30 UTC ของวันก่อนหน้า — ย้ายไปใช้ cron-job.org แล้ว
  #   - cron: '30 22 * * *'

concurrency:
  group: sync-tickets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tickets sync
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node sync-tickets.js
