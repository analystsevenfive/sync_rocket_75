name: Sync Employee Organization Chart

on:
  workflow_dispatch:
  schedule:
    # 06:00 เวลาไทย (UTC+7) = 23:00 UTC ของวันก่อนหน้า
    - cron: '0 23 * * *'
    # 17:00 เวลาไทย (UTC+7) = 10:00 UTC
    - cron: '0 10 * * *'

concurrency:
  group: sync-employee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run employee organization chart sync
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node sync-employee.js
