name: Ticket Stage Test

on:
  workflow_dispatch:
    inputs:
      parent_limit:
        description: 'จำนวน parent ticket ที่จะทดสอบ (ใบแรกสุด)'
        required: false
        default: '10'
      start_date:
        description: 'วันที่เริ่ม scan (dd/MM/yyyy) — เว้นว่างไว้ = ใช้ช่วง 3 เดือนปกติ'
        required: false
        default: ''
      end_date:
        description: 'วันที่สิ้นสุด scan (dd/MM/yyyy) — ต้องกรอกคู่กับ start_date'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ticket stage sync (limited, test sheet)
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          STAGE_SHEET_NAME_OVERRIDE: 'Ticket Stage Test'
          PARENT_LIMIT: ${{ inputs.parent_limit }}
          RANGE_START_OVERRIDE: ${{ inputs.start_date }}
          RANGE_END_OVERRIDE: ${{ inputs.end_date }}
        run: node sync-ticket-stage.js
