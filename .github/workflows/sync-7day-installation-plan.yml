name: Sync 7-Day Installation Plan

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (DD/MM/YYYY) — ปล่อยว่างเพื่อใช้ย้อนหลัง 7 วัน'
        required: false
        default: ''
      end_date:
        description: 'End date (DD/MM/YYYY) — ปล่อยว่างเพื่อใช้วันนี้'
        required: false
        default: ''
  push:
    paths:
      - 'github_action/sync-7day-installation-plan.js'
      - '.github/workflows/sync-7day-installation-plan.yml'
  # schedule:
  #   # 06:00 เวลาไทย (UTC+7) = 23:00 UTC ของวันก่อนหน้า — วันละครั้ง
  #   - cron: '0 23 * * *'

concurrency:
  group: sync-7day-installation-plan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run 7-day installation plan sync
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PLAN_START_DATE: ${{ github.event.inputs.start_date }}
          PLAN_END_DATE: ${{ github.event.inputs.end_date }}
        run: node sync-7day-installation-plan.js
