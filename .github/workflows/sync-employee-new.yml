name: Sync Employee New

on:
  workflow_dispatch:

concurrency:
  group: sync-employee-new
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Update Employee New sheet
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node ../HR/sync-employee-new.js
