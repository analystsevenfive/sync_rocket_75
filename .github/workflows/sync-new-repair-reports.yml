name: Sync New Repair Reports

on:
  workflow_dispatch:
    inputs:
      report_date_from:
        description: 'Report Date from (YYYY-MM-DD; blank = today)'
        required: false
        type: string
      report_date_to:
        description: 'Report Date to (YYYY-MM-DD; blank = same as from, or today)'
        required: false
        type: string

concurrency:
  group: sync-new-repair-reports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update new repair reports by Report Date
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          REPORT_DATE_FROM: ${{ inputs.report_date_from }}
          REPORT_DATE_TO: ${{ inputs.report_date_to }}
        run: node sync-new-repair-reports.js
