name: POC Missing Ticket

on:
  workflow_dispatch:
    inputs:
      parent_id:
        description: 'Parent ticket ID (จาก ticket_view.php?id=...)'
        required: false
        default: '1627167229'
      sub_id:
        description: 'Sub ticket ID (จาก ticket_checkrepair_view.php?id=...)'
        required: false
        default: '4311686020'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check missing ticket
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          CHECK_PARENT_ID: ${{ inputs.parent_id }}
          CHECK_SUB_ID: ${{ inputs.sub_id }}
        run: node poc-missing-ticket.js
