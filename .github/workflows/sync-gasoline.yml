name: Sync Gasoline Detail

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (DD/MM/YYYY) — ปล่อยว่างเพื่อใช้วันที่ 1 ของเดือนปัจจุบัน'
        required: false
        default: ''
      end_date:
        description: 'End date (DD/MM/YYYY) — ปล่อยว่างเพื่อใช้วันนี้'
        required: false
        default: ''
  # schedule:
  #   # 06:05 เวลาไทย (UTC+7) = 23:05 UTC ของวันก่อนหน้า — ย้ายไปใช้ cron-job.org แล้ว
  #   - cron: '5 23 * * *'

concurrency:
  group: sync-gasoline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run gasoline sync
        env:
          ROCKET_USERNAME: ${{ secrets.ROCKET_USERNAME }}
          ROCKET_PASSWORD: ${{ secrets.ROCKET_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GASOLINE_START_DATE: ${{ inputs.start_date }}
          GASOLINE_END_DATE: ${{ inputs.end_date }}
        run: node sync-gasoline.js
